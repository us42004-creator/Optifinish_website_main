<svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="pt7bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="1120" height="400" fill="url(#pt7bg)"/>

  <!-- Grid -->
  <line x1="0"    y1="80"  x2="1120" y2="80"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"    y1="160" x2="1120" y2="160" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"    y1="240" x2="1120" y2="240" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"    y1="320" x2="1120" y2="320" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="160"  y1="0"   x2="160"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="320"  y1="0"   x2="320"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="480"  y1="0"   x2="480"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="640"  y1="0"   x2="640"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="800"  y1="0"   x2="800"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="960"  y1="0"   x2="960"  y2="400" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="5" y="58" width="1110" height="8" rx="3"
        fill="rgba(140,150,160,0.28)" stroke="rgba(180,185,190,0.22)" stroke-width="1"/>
  <polygon points="1090,59 1106,62 1090,65" fill="rgba(254,206,0,0.48)"/>
  <text x="940" y="52" fill="rgba(254,206,0,0.35)" font-size="9" font-weight="600" letter-spacing="0.14em">PROCESS FLOW →</text>

  <!-- Entry part (raw steel) -->
  <line x1="18" y1="66" x2="18" y2="78" stroke="rgba(200,210,220,0.32)" stroke-width="1.5"/>
  <rect x="8" y="78" width="18" height="52" rx="1"
        fill="rgba(130,140,152,0.28)" stroke="rgba(170,180,192,0.45)" stroke-width="1.5"/>
  <circle cx="12" cy="78" r="1.5" fill="rgba(185,80,18,0.55)"/>
  <circle cx="17" cy="77" r="2"   fill="rgba(185,80,18,0.50)"/>
  <circle cx="22" cy="78" r="1.5" fill="rgba(185,80,18,0.52)"/>
  <text x="17" y="142" fill="rgba(255,255,255,0.25)" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">RAW</text>

  <!-- Exit part (zinc phosphated) -->
  <line x1="1102" y1="66" x2="1102" y2="78" stroke="rgba(200,210,220,0.30)" stroke-width="1.5"/>
  <rect x="1092" y="78" width="18" height="52" rx="1"
        fill="rgba(99,102,241,0.20)" stroke="rgba(99,102,241,0.55)" stroke-width="1.5"/>
  <rect x="1092" y="78" width="18" height="3" rx="1" fill="rgba(99,102,241,0.50)"/>
  <text x="1101" y="142" fill="rgba(99,102,241,0.65)" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em">Zn·PO₄</text>

  <!-- ═══ SPRAY TUNNEL — outer shell ═══ -->
  <rect x="28" y="70" width="1064" height="220" rx="5"
        fill="rgba(18,24,32,0.80)" stroke="rgba(175,185,198,0.28)" stroke-width="1.5"/>
  <rect x="28" y="70" width="1064" height="14" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>
  <rect x="28" y="276" width="1064" height="14" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>

  <!-- Section width = 1064/7 ≈ 152px. Centers: 104, 256, 408, 560, 712, 864, 1016 -->

  <!-- ═══ STAGE 1 — DEGREASE 1 (amber) ═══ -->
  <rect x="28"  y="84" width="152" height="206" fill="rgba(245,158,11,0.10)"/>
  <rect x="28"  y="70" width="152" height="6"   fill="rgba(245,158,11,0.55)"/>
  <text x="104" y="198" fill="rgba(245,158,11,0.05)" font-size="72" font-weight="900" text-anchor="middle">01</text>
  <line x1="104" y1="84" x2="104" y2="106" stroke="rgba(245,158,11,0.40)" stroke-width="1.5"/>
  <line x1="104" y1="106" x2="86"  y2="122" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <line x1="104" y1="106" x2="122" y2="122" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <circle cx="104" cy="84" r="2" fill="rgba(245,158,11,0.50)"/>
  <text x="104" y="142" fill="rgba(245,158,11,0.88)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DEGREASE 1</text>
  <text x="104" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Hot alkali pre-clean</text>
  <text x="104" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Removes bulk oils &amp; soils</text>
  <rect x="54"  y="218" width="100" height="17" rx="8.5"
        fill="rgba(245,158,11,0.14)" stroke="rgba(245,158,11,0.38)" stroke-width="1"/>
  <text x="104" y="230" fill="rgba(245,158,11,0.78)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">50 – 70 °C</text>
  <text x="104" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">pH 10 – 13</text>

  <!-- ═══ STAGE 2 — DEGREASE 2 (amber-light) ═══ -->
  <rect x="180" y="84" width="152" height="206" fill="rgba(251,191,36,0.09)"/>
  <rect x="180" y="70" width="152" height="6"   fill="rgba(251,191,36,0.48)"/>
  <text x="256" y="198" fill="rgba(251,191,36,0.05)" font-size="72" font-weight="900" text-anchor="middle">02</text>
  <line x1="256" y1="84" x2="256" y2="106" stroke="rgba(251,191,36,0.38)" stroke-width="1.5"/>
  <line x1="256" y1="106" x2="238" y2="122" stroke="rgba(251,191,36,0.26)" stroke-width="1"/>
  <line x1="256" y1="106" x2="274" y2="122" stroke="rgba(251,191,36,0.26)" stroke-width="1"/>
  <circle cx="256" cy="84" r="2" fill="rgba(251,191,36,0.48)"/>
  <text x="256" y="142" fill="rgba(251,191,36,0.85)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DEGREASE 2</text>
  <text x="256" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Counter-current rinse</text>
  <text x="256" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Removes residual trace oils</text>
  <rect x="206" y="218" width="100" height="17" rx="8.5"
        fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.35)" stroke-width="1"/>
  <text x="256" y="230" fill="rgba(251,191,36,0.75)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">40 – 60 °C</text>
  <text x="256" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">pH 9 – 12</text>

  <!-- ═══ STAGE 3 — DERUSTING (red) ═══ -->
  <rect x="332" y="84" width="152" height="206" fill="rgba(239,68,68,0.10)"/>
  <rect x="332" y="70" width="152" height="6"   fill="rgba(239,68,68,0.52)"/>
  <text x="408" y="198" fill="rgba(239,68,68,0.05)" font-size="72" font-weight="900" text-anchor="middle">03</text>
  <line x1="408" y1="84" x2="408" y2="106" stroke="rgba(239,68,68,0.40)" stroke-width="1.5"/>
  <line x1="408" y1="106" x2="390" y2="122" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <line x1="408" y1="106" x2="426" y2="122" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <circle cx="408" cy="84" r="2" fill="rgba(239,68,68,0.50)"/>
  <text x="408" y="142" fill="rgba(239,68,68,0.88)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DERUSTING</text>
  <text x="408" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Acid pickling — HCl</text>
  <text x="408" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Removes scale &amp; surface rust</text>
  <rect x="358" y="218" width="100" height="17" rx="8.5"
        fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.38)" stroke-width="1"/>
  <text x="408" y="230" fill="rgba(239,68,68,0.78)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">pH 1 – 3 · ACID</text>
  <text x="408" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">AMBIENT</text>

  <!-- ═══ STAGE 4 — ACTIVATION (green) ═══ -->
  <rect x="484" y="84" width="152" height="206" fill="rgba(34,197,94,0.09)"/>
  <rect x="484" y="70" width="152" height="6"   fill="rgba(34,197,94,0.48)"/>
  <text x="560" y="198" fill="rgba(34,197,94,0.05)" font-size="72" font-weight="900" text-anchor="middle">04</text>
  <line x1="560" y1="84" x2="560" y2="106" stroke="rgba(34,197,94,0.38)" stroke-width="1.5"/>
  <line x1="560" y1="106" x2="542" y2="122" stroke="rgba(34,197,94,0.26)" stroke-width="1"/>
  <line x1="560" y1="106" x2="578" y2="122" stroke="rgba(34,197,94,0.26)" stroke-width="1"/>
  <circle cx="560" cy="84" r="2" fill="rgba(34,197,94,0.48)"/>
  <text x="560" y="142" fill="rgba(34,197,94,0.85)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">ACTIVATION</text>
  <text x="560" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Ti salt activation</text>
  <text x="560" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Uniform Zn-phos nucleation</text>
  <rect x="510" y="218" width="100" height="17" rx="8.5"
        fill="rgba(34,197,94,0.11)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
  <text x="560" y="230" fill="rgba(34,197,94,0.75)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">AMBIENT</text>
  <text x="560" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">pH 8 – 9</text>

  <!-- ═══ STAGE 5 — ZINC PHOSPHATE (indigo) ═══ -->
  <rect x="636" y="84" width="152" height="206" fill="rgba(99,102,241,0.12)"/>
  <rect x="636" y="70" width="152" height="6"   fill="rgba(99,102,241,0.58)"/>
  <text x="712" y="198" fill="rgba(99,102,241,0.055)" font-size="72" font-weight="900" text-anchor="middle">05</text>
  <line x1="712" y1="84" x2="712" y2="106" stroke="rgba(99,102,241,0.42)" stroke-width="1.5"/>
  <line x1="712" y1="106" x2="694" y2="122" stroke="rgba(99,102,241,0.30)" stroke-width="1"/>
  <line x1="712" y1="106" x2="730" y2="122" stroke="rgba(99,102,241,0.30)" stroke-width="1"/>
  <circle cx="712" cy="84" r="2" fill="rgba(99,102,241,0.52)"/>
  <text x="712" y="142" fill="rgba(99,102,241,0.90)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">ZINC PHOSPHATE</text>
  <text x="712" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Conversion coating</text>
  <text x="712" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle">Zn₃(PO₄)₂ crystalline layer</text>
  <rect x="662" y="218" width="100" height="17" rx="8.5"
        fill="rgba(99,102,241,0.14)" stroke="rgba(99,102,241,0.40)" stroke-width="1"/>
  <text x="712" y="230" fill="rgba(99,102,241,0.80)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">30 – 50 °C</text>
  <text x="712" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">500+ hrs salt spray</text>

  <!-- ═══ STAGE 6 — PASSIVATION (teal) ═══ -->
  <rect x="788" y="84" width="152" height="206" fill="rgba(20,184,166,0.09)"/>
  <rect x="788" y="70" width="152" height="6"   fill="rgba(20,184,166,0.48)"/>
  <text x="864" y="198" fill="rgba(20,184,166,0.05)" font-size="72" font-weight="900" text-anchor="middle">06</text>
  <line x1="864" y1="84" x2="864" y2="106" stroke="rgba(20,184,166,0.38)" stroke-width="1.5"/>
  <line x1="864" y1="106" x2="846" y2="122" stroke="rgba(20,184,166,0.26)" stroke-width="1"/>
  <line x1="864" y1="106" x2="882" y2="122" stroke="rgba(20,184,166,0.26)" stroke-width="1"/>
  <circle cx="864" cy="84" r="2" fill="rgba(20,184,166,0.48)"/>
  <text x="864" y="142" fill="rgba(20,184,166,0.85)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">PASSIVATION</text>
  <text x="864" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Chromate-free passivant</text>
  <text x="864" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Seals the phosphate layer</text>
  <rect x="814" y="218" width="100" height="17" rx="8.5"
        fill="rgba(20,184,166,0.11)" stroke="rgba(20,184,166,0.35)" stroke-width="1"/>
  <text x="864" y="230" fill="rgba(20,184,166,0.75)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">AMBIENT</text>
  <text x="864" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">Cr-free passivant</text>

  <!-- ═══ STAGE 7 — DI WATER RINSE (cyan) ═══ -->
  <rect x="940" y="84" width="152" height="206" fill="rgba(6,182,212,0.09)"/>
  <rect x="940" y="70" width="152" height="6"   fill="rgba(6,182,212,0.48)"/>
  <text x="1016" y="198" fill="rgba(6,182,212,0.05)" font-size="72" font-weight="900" text-anchor="middle">07</text>
  <line x1="1016" y1="84" x2="1016" y2="106" stroke="rgba(6,182,212,0.38)" stroke-width="1.5"/>
  <line x1="1016" y1="106" x2="998"  y2="122" stroke="rgba(6,182,212,0.26)" stroke-width="1"/>
  <line x1="1016" y1="106" x2="1034" y2="122" stroke="rgba(6,182,212,0.26)" stroke-width="1"/>
  <circle cx="1016" cy="84" r="2" fill="rgba(6,182,212,0.48)"/>
  <text x="1016" y="142" fill="rgba(6,182,212,0.82)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DI WATER RINSE</text>
  <text x="1016" y="156" fill="rgba(255,255,255,0.55)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Final deionised rinse</text>
  <text x="1016" y="168" fill="rgba(255,255,255,0.35)" font-size="8.5" text-anchor="middle" letter-spacing="0.03em">Removes ionic residues</text>
  <rect x="966" y="218" width="100" height="17" rx="8.5"
        fill="rgba(6,182,212,0.11)" stroke="rgba(6,182,212,0.35)" stroke-width="1"/>
  <text x="1016" y="230" fill="rgba(6,182,212,0.72)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DI · &lt;10 μS/cm</text>
  <text x="1016" y="256" fill="rgba(255,255,255,0.20)" font-size="8" text-anchor="middle" letter-spacing="0.05em">Surface ready for powder</text>

  <!-- ═══ STAGE DIVIDERS ═══ -->
  <line x1="180"  y1="70" x2="180"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="332"  y1="70" x2="332"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="484"  y1="70" x2="484"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="636"  y1="70" x2="636"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="788"  y1="70" x2="788"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="940"  y1="70" x2="940"  y2="290" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ═══ BOTTOM BADGE ═══ -->
  <rect x="310" y="308" width="500" height="22" rx="11"
        fill="rgba(254,206,0,0.08)" stroke="rgba(254,206,0,0.28)" stroke-width="1"/>
  <text x="560" y="323" fill="rgba(254,206,0,0.68)" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.14em">7-STAGE ZINC PHOSPHATE LINE · 500+ HRS SALT SPRAY · ISO 9227</text>

  <text x="560" y="358" fill="rgba(255,255,255,0.20)" font-size="9.5" text-anchor="middle" letter-spacing="0.05em">Automotive · infrastructure · heavy engineering · maximum corrosion environments</text>

  <!-- Ghost number -->
  <text x="960" y="395" fill="rgba(254,206,0,0.04)" font-size="100" font-weight="900" letter-spacing="-0.05em">7</text>
</svg>
