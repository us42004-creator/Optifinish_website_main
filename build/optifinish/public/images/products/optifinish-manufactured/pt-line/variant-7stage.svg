<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="pt7bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="520" fill="url(#pt7bg)"/>

  <!-- Grid -->
  <line x1="0"   y1="104" x2="760" y2="104" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="208" x2="760" y2="208" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="312" x2="760" y2="312" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="416" x2="760" y2="416" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="152" y1="0"   x2="152" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="304" y1="0"   x2="304" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="456" y1="0"   x2="456" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="608" y1="0"   x2="608" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- ═══ TOP CONVEYOR RAIL (left → right, stages 1–4) ═══ -->
  <rect x="5" y="40" width="680" height="7" rx="2"
        fill="rgba(140,150,160,0.26)" stroke="rgba(180,185,190,0.20)" stroke-width="1"/>
  <polygon points="663,41 677,43.5 663,46" fill="rgba(254,206,0,0.42)"/>

  <!-- ═══ BOTTOM CONVEYOR RAIL (right → left, stages 5–7, exit left) ═══ -->
  <rect x="75" y="322" width="680" height="7" rx="2"
        fill="rgba(140,150,160,0.26)" stroke="rgba(180,185,190,0.20)" stroke-width="1"/>
  <polygon points="92,323 78,325.5 92,328" fill="rgba(254,206,0,0.42)"/>

  <!-- ═══ U-TURN ARROW (right side) ═══ -->
  <path d="M685,47 Q720,47 720,165 Q720,283 685,283" fill="none"
        stroke="rgba(254,206,0,0.32)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polygon points="688,279 685,287 681,279" fill="rgba(254,206,0,0.42)"/>
  <text x="726" y="170" fill="rgba(254,206,0,0.30)" font-size="9" font-weight="600" letter-spacing="0.12em" writing-mode="tb">U-TURN</text>

  <!-- ═══ ENTRY PART (top-left) — raw steel ═══ -->
  <line x1="18" y1="47" x2="18" y2="58" stroke="rgba(200,210,220,0.30)" stroke-width="1.5"/>
  <rect x="9" y="58" width="18" height="52" rx="1"
        fill="rgba(130,140,152,0.28)" stroke="rgba(170,180,192,0.42)" stroke-width="1.5"/>
  <circle cx="12" cy="58" r="1.8" fill="rgba(185,80,18,0.55)"/>
  <circle cx="18" cy="57" r="2.2" fill="rgba(185,80,18,0.50)"/>
  <circle cx="24" cy="58" r="1.8" fill="rgba(185,80,18,0.52)"/>
  <text x="18" y="122" fill="rgba(255,255,255,0.25)" font-size="8.5" text-anchor="middle" letter-spacing="0.08em">IN</text>

  <!-- ═══ EXIT PART (bottom-left) — fully zinc phosphated ═══ -->
  <line x1="88" y1="322" x2="88" y2="333" stroke="rgba(200,210,220,0.28)" stroke-width="1.5"/>
  <rect x="79" y="333" width="18" height="52" rx="1"
        fill="rgba(99,102,241,0.20)" stroke="rgba(99,102,241,0.52)" stroke-width="1.5"/>
  <rect x="79" y="333" width="18" height="5" rx="1" fill="rgba(99,102,241,0.48)"/>
  <text x="88" y="397" fill="rgba(99,102,241,0.55)" font-size="8.5" text-anchor="middle" letter-spacing="0.08em">OUT</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--                TOP TUNNEL (Stages 1–4)                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Tunnel shell: x=28 to x=688, y=55, h=190 -->
  <rect x="28" y="55" width="660" height="190" rx="5"
        fill="rgba(18,24,32,0.80)" stroke="rgba(175,185,198,0.26)" stroke-width="1.5"/>
  <rect x="28" y="55"  width="660" height="15" rx="3"
        fill="rgba(42,50,60,0.60)" stroke="rgba(175,185,198,0.18)" stroke-width="1"/>
  <rect x="28" y="230" width="660" height="15" rx="3"
        fill="rgba(42,50,60,0.60)" stroke="rgba(175,185,198,0.18)" stroke-width="1"/>

  <!-- 4 sections in 660px → 165px each -->
  <!-- Boundaries: 28, 193, 358, 523, 688 -->
  <!-- Centers: 110, 275, 440, 605 -->

  <!-- ─── Stage 1 — Degrease pass 1 ─── -->
  <rect x="28"  y="70" width="165" height="160" fill="rgba(245,158,11,0.10)"/>
  <rect x="28"  y="55" width="165" height="5"   fill="rgba(245,158,11,0.55)"/>
  <text x="110" y="190" fill="rgba(245,158,11,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">01</text>
  <line x1="110" y1="70" x2="110" y2="90" stroke="rgba(245,158,11,0.38)" stroke-width="1.5"/>
  <line x1="110" y1="90" x2="94"  y2="106" stroke="rgba(245,158,11,0.26)" stroke-width="1"/>
  <line x1="110" y1="90" x2="126" y2="106" stroke="rgba(245,158,11,0.26)" stroke-width="1"/>
  <circle cx="110" cy="70" r="2" fill="rgba(245,158,11,0.48)"/>
  <text x="110" y="122" fill="rgba(245,158,11,0.85)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DEGREASE 1</text>
  <text x="110" y="136" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Hot alkali pre-clean</text>
  <text x="110" y="148" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes bulk oils &amp; soils</text>
  <rect x="52"  y="200" width="116" height="17" rx="8.5"
        fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.34)" stroke-width="1"/>
  <text x="110" y="212" fill="rgba(245,158,11,0.72)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">50 – 70 °C</text>

  <!-- ─── Stage 2 — Degrease pass 2 ─── -->
  <rect x="193" y="70" width="165" height="160" fill="rgba(245,158,11,0.07)"/>
  <rect x="193" y="55" width="165" height="5"   fill="rgba(245,158,11,0.35)"/>
  <text x="275" y="190" fill="rgba(245,158,11,0.040)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">02</text>
  <line x1="275" y1="70" x2="275" y2="90" stroke="rgba(245,158,11,0.32)" stroke-width="1.5"/>
  <line x1="275" y1="90" x2="259" y2="106" stroke="rgba(245,158,11,0.22)" stroke-width="1"/>
  <line x1="275" y1="90" x2="291" y2="106" stroke="rgba(245,158,11,0.22)" stroke-width="1"/>
  <circle cx="275" cy="70" r="2" fill="rgba(245,158,11,0.40)"/>
  <text x="275" y="122" fill="rgba(245,158,11,0.70)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DEGREASE 2</text>
  <text x="275" y="136" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Counter-current rinse</text>
  <text x="275" y="148" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes residual trace oils</text>
  <rect x="217" y="200" width="116" height="17" rx="8.5"
        fill="rgba(245,158,11,0.10)" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <text x="275" y="212" fill="rgba(245,158,11,0.60)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">40 – 60 °C</text>

  <!-- ─── Stage 3 — Derusting ─── -->
  <rect x="358" y="70" width="165" height="160" fill="rgba(239,68,68,0.10)"/>
  <rect x="358" y="55" width="165" height="5"   fill="rgba(239,68,68,0.52)"/>
  <text x="440" y="190" fill="rgba(239,68,68,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">03</text>
  <line x1="440" y1="70" x2="440" y2="90" stroke="rgba(239,68,68,0.38)" stroke-width="1.5"/>
  <line x1="440" y1="90" x2="424" y2="106" stroke="rgba(239,68,68,0.26)" stroke-width="1"/>
  <line x1="440" y1="90" x2="456" y2="106" stroke="rgba(239,68,68,0.26)" stroke-width="1"/>
  <circle cx="440" cy="70" r="2" fill="rgba(239,68,68,0.48)"/>
  <text x="440" y="122" fill="rgba(239,68,68,0.88)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DERUSTING</text>
  <text x="440" y="136" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Acid pickling — HCl</text>
  <text x="440" y="148" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes scale &amp; surface rust</text>
  <rect x="382" y="200" width="116" height="17" rx="8.5"
        fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.34)" stroke-width="1"/>
  <text x="440" y="212" fill="rgba(239,68,68,0.72)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">pH 1 – 3 · ACID</text>

  <!-- ─── Stage 4 — Activation ─── -->
  <rect x="523" y="70" width="165" height="160" fill="rgba(34,197,94,0.10)"/>
  <rect x="523" y="55" width="165" height="5"   fill="rgba(34,197,94,0.48)"/>
  <text x="605" y="190" fill="rgba(34,197,94,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">04</text>
  <line x1="605" y1="70" x2="605" y2="90" stroke="rgba(34,197,94,0.36)" stroke-width="1.5"/>
  <line x1="605" y1="90" x2="589" y2="106" stroke="rgba(34,197,94,0.24)" stroke-width="1"/>
  <line x1="605" y1="90" x2="621" y2="106" stroke="rgba(34,197,94,0.24)" stroke-width="1"/>
  <circle cx="605" cy="70" r="2" fill="rgba(34,197,94,0.45)"/>
  <text x="605" y="122" fill="rgba(34,197,94,0.85)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">ACTIVATION</text>
  <text x="605" y="136" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Ti salt activation</text>
  <text x="605" y="148" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Uniform Zn-phos nucleation</text>
  <rect x="547" y="200" width="116" height="17" rx="8.5"
        fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.30)" stroke-width="1"/>
  <text x="605" y="212" fill="rgba(34,197,94,0.68)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">AMBIENT</text>

  <!-- ─── Top tunnel dividers ─── -->
  <line x1="193" y1="55" x2="193" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="358" y1="55" x2="358" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="523" y1="55" x2="523" y2="245" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!--               BOTTOM TUNNEL (Stages 5–7)               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Tunnel: x=72 to x=732, y=290, h=190 -->
  <rect x="72" y="290" width="660" height="190" rx="5"
        fill="rgba(18,24,32,0.80)" stroke="rgba(175,185,198,0.26)" stroke-width="1.5"/>
  <rect x="72"  y="290" width="660" height="15" rx="3"
        fill="rgba(42,50,60,0.60)" stroke="rgba(175,185,198,0.18)" stroke-width="1"/>
  <rect x="72"  y="465" width="660" height="15" rx="3"
        fill="rgba(42,50,60,0.60)" stroke="rgba(175,185,198,0.18)" stroke-width="1"/>

  <!-- 3 sections in 660px → 220px each (right to left flow) -->
  <!-- x=72 to x=732, sections: 72-292, 292-512, 512-732 -->
  <!-- Stage 5 = rightmost (512-732, center=622) -->
  <!-- Stage 6 = middle (292-512, center=402) -->
  <!-- Stage 7 = leftmost/exit (72-292, center=182) -->

  <!-- ─── Stage 5 — Zinc Phosphate ─── -->
  <rect x="512" y="305" width="220" height="160" fill="rgba(99,102,241,0.12)"/>
  <rect x="512" y="290" width="220" height="5"   fill="rgba(99,102,241,0.55)"/>
  <text x="622" y="428" fill="rgba(99,102,241,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">05</text>
  <line x1="622" y1="305" x2="622" y2="325" stroke="rgba(99,102,241,0.40)" stroke-width="1.5"/>
  <line x1="622" y1="325" x2="606" y2="341" stroke="rgba(99,102,241,0.28)" stroke-width="1"/>
  <line x1="622" y1="325" x2="638" y2="341" stroke="rgba(99,102,241,0.28)" stroke-width="1"/>
  <circle cx="622" cy="305" r="2" fill="rgba(99,102,241,0.50)"/>
  <text x="622" y="358" fill="rgba(99,102,241,0.92)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">ZINC PHOSPHATE</text>
  <text x="622" y="372" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Conversion coating — Zn₃(PO₄)₂</text>
  <text x="622" y="384" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Dense crystalline zinc phosphate</text>
  <text x="622" y="395" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">layer · 500+ hrs salt spray</text>
  <rect x="564" y="430" width="116" height="17" rx="8.5"
        fill="rgba(99,102,241,0.14)" stroke="rgba(99,102,241,0.40)" stroke-width="1"/>
  <text x="622" y="442" fill="rgba(99,102,241,0.80)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">30 – 50 °C</text>

  <!-- ─── Stage 6 — Passivation ─── -->
  <rect x="292" y="305" width="220" height="160" fill="rgba(20,184,166,0.10)"/>
  <rect x="292" y="290" width="220" height="5"   fill="rgba(20,184,166,0.50)"/>
  <text x="402" y="428" fill="rgba(20,184,166,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">06</text>
  <line x1="402" y1="305" x2="402" y2="325" stroke="rgba(20,184,166,0.36)" stroke-width="1.5"/>
  <line x1="402" y1="325" x2="386" y2="341" stroke="rgba(20,184,166,0.24)" stroke-width="1"/>
  <line x1="402" y1="325" x2="418" y2="341" stroke="rgba(20,184,166,0.24)" stroke-width="1"/>
  <circle cx="402" cy="305" r="2" fill="rgba(20,184,166,0.45)"/>
  <text x="402" y="358" fill="rgba(20,184,166,0.85)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">PASSIVATION</text>
  <text x="402" y="372" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Chromate-free passivant</text>
  <text x="402" y="384" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Seals the phosphate layer</text>
  <text x="402" y="395" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">improves corrosion resistance</text>
  <rect x="344" y="430" width="116" height="17" rx="8.5"
        fill="rgba(20,184,166,0.10)" stroke="rgba(20,184,166,0.32)" stroke-width="1"/>
  <text x="402" y="442" fill="rgba(20,184,166,0.68)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">AMBIENT</text>

  <!-- ─── Stage 7 — DI Rinse ─── -->
  <rect x="72"  y="305" width="220" height="160" fill="rgba(6,182,212,0.10)"/>
  <rect x="72"  y="290" width="220" height="5"   fill="rgba(6,182,212,0.46)"/>
  <text x="182" y="428" fill="rgba(6,182,212,0.050)" font-size="68" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">07</text>
  <line x1="182" y1="305" x2="182" y2="325" stroke="rgba(6,182,212,0.34)" stroke-width="1.5"/>
  <line x1="182" y1="325" x2="166" y2="341" stroke="rgba(6,182,212,0.22)" stroke-width="1"/>
  <line x1="182" y1="325" x2="198" y2="341" stroke="rgba(6,182,212,0.22)" stroke-width="1"/>
  <circle cx="182" cy="305" r="2" fill="rgba(6,182,212,0.42)"/>
  <text x="182" y="358" fill="rgba(6,182,212,0.80)" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DI WATER RINSE</text>
  <text x="182" y="372" fill="rgba(255,255,255,0.52)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Final deionised rinse</text>
  <text x="182" y="384" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes all ionic residues</text>
  <text x="182" y="395" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Surface ready for powder coat</text>
  <rect x="124" y="430" width="116" height="17" rx="8.5"
        fill="rgba(6,182,212,0.10)" stroke="rgba(6,182,212,0.30)" stroke-width="1"/>
  <text x="182" y="442" fill="rgba(6,182,212,0.65)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DI · &lt;10 μS/cm</text>

  <!-- ─── Bottom tunnel dividers ─── -->
  <line x1="292" y1="290" x2="292" y2="480" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="512" y1="290" x2="512" y2="480" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ═══ SALT SPRAY BADGE ═══ -->
  <rect x="218" y="491" width="324" height="22" rx="11"
        fill="rgba(254,206,0,0.10)" stroke="rgba(254,206,0,0.35)" stroke-width="1.5"/>
  <text x="380" y="506" fill="rgba(254,206,0,0.80)" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.14em">500+ HRS SALT SPRAY · ISO 9227</text>

  <!-- Ghost number -->
  <text x="550" y="515" fill="rgba(254,206,0,0.035)" font-size="130" font-weight="900" letter-spacing="-0.05em">7</text>
</svg>
