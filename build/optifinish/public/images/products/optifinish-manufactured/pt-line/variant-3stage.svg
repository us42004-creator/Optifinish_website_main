<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="pt3bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="480" fill="url(#pt3bg)"/>

  <!-- Grid -->
  <line x1="0"   y1="96"  x2="760" y2="96"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="192" x2="760" y2="192" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="288" x2="760" y2="288" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="384" x2="760" y2="384" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="95"  y1="0"   x2="95"  y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="190" y1="0"   x2="190" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="285" y1="0"   x2="285" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="380" y1="0"   x2="380" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="475" y1="0"   x2="475" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="570" y1="0"   x2="570" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="665" y1="0"   x2="665" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="5" y="68" width="750" height="8" rx="3"
        fill="rgba(140,150,160,0.28)" stroke="rgba(180,185,190,0.22)" stroke-width="1"/>
  <polygon points="729,69 745,72 729,75" fill="rgba(254,206,0,0.48)"/>
  <text x="618" y="62" fill="rgba(254,206,0,0.35)" font-size="9" font-weight="600" letter-spacing="0.14em">PROCESS FLOW →</text>

  <!-- ═══ ENTRY PART — raw steel ═══ -->
  <line x1="18" y1="76" x2="18" y2="90" stroke="rgba(200,210,220,0.32)" stroke-width="1.5"/>
  <rect x="8" y="90" width="20" height="70" rx="1"
        fill="rgba(130,140,152,0.28)" stroke="rgba(170,180,192,0.45)" stroke-width="1.5"/>
  <!-- Rust/dirt spots on top surface -->
  <circle cx="12" cy="90" r="2"   fill="rgba(185,80,18,0.55)"/>
  <circle cx="18" cy="89" r="2.5" fill="rgba(185,80,18,0.50)"/>
  <circle cx="24" cy="90" r="2"   fill="rgba(185,80,18,0.52)"/>
  <text x="18" y="178" fill="rgba(255,255,255,0.28)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.10em">RAW</text>
  <text x="18" y="190" fill="rgba(255,255,255,0.22)" font-size="9" text-anchor="middle" letter-spacing="0.08em">SUBSTRATE</text>

  <!-- ═══ EXIT PART — phosphated ═══ -->
  <line x1="742" y1="76" x2="742" y2="90" stroke="rgba(200,210,220,0.30)" stroke-width="1.5"/>
  <rect x="732" y="90" width="20" height="70" rx="1"
        fill="rgba(59,130,246,0.18)" stroke="rgba(59,130,246,0.50)" stroke-width="1.5"/>
  <!-- Phosphate layer indication (clean top) -->
  <rect x="732" y="90" width="20" height="4" rx="1" fill="rgba(59,130,246,0.45)"/>
  <text x="742" y="178" fill="rgba(59,130,246,0.62)" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="0.10em">PHOSPHATED</text>
  <text x="742" y="190" fill="rgba(59,130,246,0.45)" font-size="9" text-anchor="middle" letter-spacing="0.08em">SURFACE</text>

  <!-- ═══ SPRAY TUNNEL — outer shell ═══ -->
  <rect x="28" y="84" width="704" height="250" rx="5"
        fill="rgba(18,24,32,0.80)" stroke="rgba(175,185,198,0.28)" stroke-width="1.5"/>
  <!-- Top insulation -->
  <rect x="28" y="84" width="704" height="18" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>
  <!-- Bottom insulation -->
  <rect x="28" y="316" width="704" height="18" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>

  <!-- ═══ STAGE 1 — DEGREASING ═══ -->
  <!-- Stage fill -->
  <rect x="28"  y="102" width="234" height="214" fill="rgba(245,158,11,0.10)"/>
  <!-- Color top bar -->
  <rect x="28"  y="84"  width="234" height="6"   fill="rgba(245,158,11,0.55)"/>
  <!-- Ghost number -->
  <text x="145" y="248" fill="rgba(245,158,11,0.055)" font-size="88" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">01</text>
  <!-- Nozzle indicator -->
  <line x1="145" y1="102" x2="145" y2="128" stroke="rgba(245,158,11,0.40)" stroke-width="1.5"/>
  <line x1="145" y1="128" x2="122" y2="148" stroke="rgba(245,158,11,0.30)" stroke-width="1"/>
  <line x1="145" y1="128" x2="168" y2="148" stroke="rgba(245,158,11,0.30)" stroke-width="1"/>
  <circle cx="145" cy="102" r="2.5" fill="rgba(245,158,11,0.50)"/>
  <!-- Stage name -->
  <text x="145" y="168" fill="rgba(245,158,11,0.88)" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.12em">DEGREASING</text>
  <!-- Chemical/method -->
  <text x="145" y="185" fill="rgba(255,255,255,0.58)" font-size="11.5" text-anchor="middle" letter-spacing="0.06em">Alkaline wash solution</text>
  <!-- Description lines -->
  <text x="145" y="200" fill="rgba(255,255,255,0.38)" font-size="10" text-anchor="middle" letter-spacing="0.04em">Removes oils, grease &amp; surface</text>
  <text x="145" y="213" fill="rgba(255,255,255,0.35)" font-size="10" text-anchor="middle" letter-spacing="0.04em">contamination from substrate</text>
  <!-- Temp badge -->
  <rect x="83"  y="264" width="124" height="20" rx="10"
        fill="rgba(245,158,11,0.14)" stroke="rgba(245,158,11,0.38)" stroke-width="1"/>
  <text x="145" y="278" fill="rgba(245,158,11,0.78)" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.10em">40 – 60 °C</text>
  <!-- Surface state — dirty substrate entering -->
  <text x="145" y="308" fill="rgba(255,255,255,0.22)" font-size="9" text-anchor="middle" letter-spacing="0.08em">pH 10 – 12  ·  steel &amp; aluminium</text>

  <!-- ═══ STAGE 2 — IRON PHOSPHATE ═══ -->
  <rect x="262" y="102" width="234" height="214" fill="rgba(59,130,246,0.12)"/>
  <rect x="262" y="84"  width="234" height="6"   fill="rgba(59,130,246,0.58)"/>
  <text x="379" y="248" fill="rgba(59,130,246,0.055)" font-size="88" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">02</text>
  <!-- Nozzle -->
  <line x1="379" y1="102" x2="379" y2="128" stroke="rgba(59,130,246,0.42)" stroke-width="1.5"/>
  <line x1="379" y1="128" x2="356" y2="148" stroke="rgba(59,130,246,0.32)" stroke-width="1"/>
  <line x1="379" y1="128" x2="402" y2="148" stroke="rgba(59,130,246,0.32)" stroke-width="1"/>
  <circle cx="379" cy="102" r="2.5" fill="rgba(59,130,246,0.52)"/>
  <!-- Stage name -->
  <text x="379" y="168" fill="rgba(59,130,246,0.92)" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.12em">IRON PHOSPHATE</text>
  <!-- Chemical -->
  <text x="379" y="185" fill="rgba(255,255,255,0.58)" font-size="11.5" text-anchor="middle" letter-spacing="0.06em">Conversion coating stage</text>
  <!-- Description -->
  <text x="379" y="200" fill="rgba(255,255,255,0.38)" font-size="10" text-anchor="middle" letter-spacing="0.04em">Crystalline iron phosphate layer</text>
  <text x="379" y="213" fill="rgba(255,255,255,0.35)" font-size="10" text-anchor="middle" letter-spacing="0.04em">bonds chemically to steel surface</text>
  <!-- Temp badge -->
  <rect x="317" y="264" width="124" height="20" rx="10"
        fill="rgba(59,130,246,0.14)" stroke="rgba(59,130,246,0.40)" stroke-width="1"/>
  <text x="379" y="278" fill="rgba(59,130,246,0.80)" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.10em">35 – 50 °C</text>
  <!-- Adhesion note -->
  <text x="379" y="308" fill="rgba(255,255,255,0.22)" font-size="9" text-anchor="middle" letter-spacing="0.08em">Adhesion foundation for powder coat</text>

  <!-- ═══ STAGE 3 — WATER RINSE ═══ -->
  <rect x="496" y="102" width="236" height="214" fill="rgba(6,182,212,0.10)"/>
  <rect x="496" y="84"  width="236" height="6"   fill="rgba(6,182,212,0.50)"/>
  <text x="614" y="248" fill="rgba(6,182,212,0.055)" font-size="88" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">03</text>
  <!-- Nozzle -->
  <line x1="614" y1="102" x2="614" y2="128" stroke="rgba(6,182,212,0.38)" stroke-width="1.5"/>
  <line x1="614" y1="128" x2="591" y2="148" stroke="rgba(6,182,212,0.28)" stroke-width="1"/>
  <line x1="614" y1="128" x2="637" y2="148" stroke="rgba(6,182,212,0.28)" stroke-width="1"/>
  <circle cx="614" cy="102" r="2.5" fill="rgba(6,182,212,0.48)"/>
  <!-- Stage name -->
  <text x="614" y="168" fill="rgba(6,182,212,0.82)" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.12em">WATER RINSE</text>
  <!-- Chemical -->
  <text x="614" y="185" fill="rgba(255,255,255,0.58)" font-size="11.5" text-anchor="middle" letter-spacing="0.06em">Deionised water final rinse</text>
  <!-- Description -->
  <text x="614" y="200" fill="rgba(255,255,255,0.38)" font-size="10" text-anchor="middle" letter-spacing="0.04em">Removes residual process chemicals</text>
  <text x="614" y="213" fill="rgba(255,255,255,0.35)" font-size="10" text-anchor="middle" letter-spacing="0.04em">and ionic contamination from surface</text>
  <!-- DI badge -->
  <rect x="552" y="264" width="124" height="20" rx="10"
        fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.35)" stroke-width="1"/>
  <text x="614" y="278" fill="rgba(6,182,212,0.72)" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.10em">DI WATER · AMBIENT</text>
  <!-- Ready note -->
  <text x="614" y="308" fill="rgba(255,255,255,0.22)" font-size="9" text-anchor="middle" letter-spacing="0.08em">Surface ready for dry-off &amp; powder</text>

  <!-- ═══ STAGE DIVIDERS ═══ -->
  <line x1="262" y1="84" x2="262" y2="334" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <line x1="496" y1="84" x2="496" y2="334" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- ═══ BOTTOM BADGE ═══ -->
  <rect x="192" y="358" width="376" height="24" rx="12"
        fill="rgba(254,206,0,0.08)" stroke="rgba(254,206,0,0.28)" stroke-width="1"/>
  <text x="380" y="374" fill="rgba(254,206,0,0.68)" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.14em">3-STAGE IRON PHOSPHATE LINE</text>

  <text x="380" y="408" fill="rgba(255,255,255,0.22)" font-size="10" text-anchor="middle" letter-spacing="0.06em">Suited for clean MS steel · mild-to-moderate corrosion environments</text>

  <!-- Ghost number -->
  <text x="550" y="472" fill="rgba(254,206,0,0.04)" font-size="120" font-weight="900" letter-spacing="-0.05em">3</text>
</svg>
