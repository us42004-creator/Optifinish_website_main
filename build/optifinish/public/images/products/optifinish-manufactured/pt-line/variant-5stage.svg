<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="pt5bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="480" fill="url(#pt5bg)"/>

  <!-- Grid -->
  <line x1="0"   y1="96"  x2="760" y2="96"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="192" x2="760" y2="192" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="288" x2="760" y2="288" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="384" x2="760" y2="384" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="152" y1="0"   x2="152" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="304" y1="0"   x2="304" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="456" y1="0"   x2="456" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="608" y1="0"   x2="608" y2="480" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="5" y="68" width="750" height="8" rx="3"
        fill="rgba(140,150,160,0.28)" stroke="rgba(180,185,190,0.22)" stroke-width="1"/>
  <polygon points="729,69 745,72 729,75" fill="rgba(254,206,0,0.48)"/>
  <text x="618" y="62" fill="rgba(254,206,0,0.35)" font-size="9" font-weight="600" letter-spacing="0.14em">PROCESS FLOW →</text>

  <!-- ═══ ENTRY PART — raw steel ═══ -->
  <line x1="16" y1="76" x2="16" y2="90" stroke="rgba(200,210,220,0.30)" stroke-width="1.5"/>
  <rect x="7" y="90" width="18" height="60" rx="1"
        fill="rgba(130,140,152,0.28)" stroke="rgba(170,180,192,0.42)" stroke-width="1.5"/>
  <circle cx="10" cy="90" r="1.8" fill="rgba(185,80,18,0.55)"/>
  <circle cx="16" cy="89" r="2.2" fill="rgba(185,80,18,0.50)"/>
  <circle cx="22" cy="90" r="1.8" fill="rgba(185,80,18,0.52)"/>
  <text x="16" y="162" fill="rgba(255,255,255,0.25)" font-size="9" text-anchor="middle" letter-spacing="0.08em">RAW</text>

  <!-- ═══ EXIT PART — passivated ═══ -->
  <line x1="744" y1="76" x2="744" y2="90" stroke="rgba(200,210,220,0.28)" stroke-width="1.5"/>
  <rect x="735" y="90" width="18" height="60" rx="1"
        fill="rgba(20,184,166,0.18)" stroke="rgba(20,184,166,0.50)" stroke-width="1.5"/>
  <rect x="735" y="90" width="18" height="4" rx="1" fill="rgba(20,184,166,0.48)"/>
  <text x="744" y="162" fill="rgba(20,184,166,0.55)" font-size="9" text-anchor="middle" letter-spacing="0.08em">CLEAN</text>

  <!-- ═══ SPRAY TUNNEL ═══ -->
  <rect x="28" y="84" width="704" height="242" rx="5"
        fill="rgba(18,24,32,0.80)" stroke="rgba(175,185,198,0.28)" stroke-width="1.5"/>
  <rect x="28" y="84"  width="704" height="17" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>
  <rect x="28" y="309" width="704" height="17" rx="3"
        fill="rgba(42,50,60,0.62)" stroke="rgba(175,185,198,0.20)" stroke-width="1"/>

  <!-- 5 sections, each 140.8px → approx 141px. Boundaries: 28, 169, 310, 451, 592, 732 -->
  <!-- Centers: 98, 239, 380, 521, 662 -->

  <!-- ═══ STAGE 1 — DEGREASING ═══ -->
  <rect x="28"  y="101" width="141" height="208" fill="rgba(245,158,11,0.10)"/>
  <rect x="28"  y="84"  width="141" height="5"   fill="rgba(245,158,11,0.55)"/>
  <text x="98"  y="232" fill="rgba(245,158,11,0.055)" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">01</text>
  <line x1="98"  y1="101" x2="98"  y2="122" stroke="rgba(245,158,11,0.40)" stroke-width="1.5"/>
  <line x1="98"  y1="122" x2="80"  y2="139" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <line x1="98"  y1="122" x2="116" y2="139" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>
  <circle cx="98"  cy="101" r="2.2" fill="rgba(245,158,11,0.50)"/>
  <text x="98"  y="158" fill="rgba(245,158,11,0.88)" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DEGREASE</text>
  <text x="98"  y="173" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Alkali wash</text>
  <text x="98"  y="185" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes oils &amp; grease</text>
  <text x="98"  y="196" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">from all surfaces</text>
  <rect x="40"  y="255" width="116" height="18" rx="9"
        fill="rgba(245,158,11,0.13)" stroke="rgba(245,158,11,0.36)" stroke-width="1"/>
  <text x="98"  y="268" fill="rgba(245,158,11,0.75)" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.08em">40 – 60 °C</text>
  <text x="98"  y="298" fill="rgba(255,255,255,0.20)" font-size="8.5" text-anchor="middle" letter-spacing="0.05em">pH 10–12 alkali</text>

  <!-- ═══ STAGE 2 — DERUSTING ═══ -->
  <rect x="169" y="101" width="141" height="208" fill="rgba(239,68,68,0.10)"/>
  <rect x="169" y="84"  width="141" height="5"   fill="rgba(239,68,68,0.55)"/>
  <text x="239" y="232" fill="rgba(239,68,68,0.055)" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">02</text>
  <line x1="239" y1="101" x2="239" y2="122" stroke="rgba(239,68,68,0.40)" stroke-width="1.5"/>
  <line x1="239" y1="122" x2="221" y2="139" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <line x1="239" y1="122" x2="257" y2="139" stroke="rgba(239,68,68,0.28)" stroke-width="1"/>
  <circle cx="239" cy="101" r="2.2" fill="rgba(239,68,68,0.50)"/>
  <text x="239" y="158" fill="rgba(239,68,68,0.88)" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DERUSTING</text>
  <text x="239" y="173" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Acid pickling</text>
  <text x="239" y="185" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes mill scale &amp; rust</text>
  <text x="239" y="196" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">from pre-rusted substrate</text>
  <rect x="181" y="255" width="116" height="18" rx="9"
        fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
  <text x="239" y="268" fill="rgba(239,68,68,0.75)" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.08em">HCl / H₂SO₄</text>
  <text x="239" y="298" fill="rgba(255,255,255,0.20)" font-size="8.5" text-anchor="middle" letter-spacing="0.05em">acid pH 1–3</text>

  <!-- ═══ STAGE 3 — IRON PHOSPHATE ═══ -->
  <rect x="310" y="101" width="141" height="208" fill="rgba(59,130,246,0.12)"/>
  <rect x="310" y="84"  width="141" height="5"   fill="rgba(59,130,246,0.58)"/>
  <text x="380" y="232" fill="rgba(59,130,246,0.055)" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">03</text>
  <line x1="380" y1="101" x2="380" y2="122" stroke="rgba(59,130,246,0.42)" stroke-width="1.5"/>
  <line x1="380" y1="122" x2="362" y2="139" stroke="rgba(59,130,246,0.30)" stroke-width="1"/>
  <line x1="380" y1="122" x2="398" y2="139" stroke="rgba(59,130,246,0.30)" stroke-width="1"/>
  <circle cx="380" cy="101" r="2.2" fill="rgba(59,130,246,0.52)"/>
  <text x="380" y="158" fill="rgba(59,130,246,0.90)" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.10em">IRON PHOS</text>
  <text x="380" y="173" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Conversion coating</text>
  <text x="380" y="185" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Crystalline phosphate layer</text>
  <text x="380" y="196" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">for coating adhesion</text>
  <rect x="322" y="255" width="116" height="18" rx="9"
        fill="rgba(59,130,246,0.13)" stroke="rgba(59,130,246,0.38)" stroke-width="1"/>
  <text x="380" y="268" fill="rgba(59,130,246,0.78)" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.08em">35 – 50 °C</text>
  <text x="380" y="298" fill="rgba(255,255,255,0.20)" font-size="8.5" text-anchor="middle" letter-spacing="0.05em">iron phosphate pH 4–5</text>

  <!-- ═══ STAGE 4 — PASSIVATION ═══ -->
  <rect x="451" y="101" width="141" height="208" fill="rgba(20,184,166,0.10)"/>
  <rect x="451" y="84"  width="141" height="5"   fill="rgba(20,184,166,0.52)"/>
  <text x="521" y="232" fill="rgba(20,184,166,0.055)" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">04</text>
  <line x1="521" y1="101" x2="521" y2="122" stroke="rgba(20,184,166,0.38)" stroke-width="1.5"/>
  <line x1="521" y1="122" x2="503" y2="139" stroke="rgba(20,184,166,0.26)" stroke-width="1"/>
  <line x1="521" y1="122" x2="539" y2="139" stroke="rgba(20,184,166,0.26)" stroke-width="1"/>
  <circle cx="521" cy="101" r="2.2" fill="rgba(20,184,166,0.48)"/>
  <text x="521" y="158" fill="rgba(20,184,166,0.85)" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.10em">PASSIVATION</text>
  <text x="521" y="173" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Chromate-free seal</text>
  <text x="521" y="185" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Seals phosphate layer</text>
  <text x="521" y="196" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">improves corrosion resistance</text>
  <rect x="463" y="255" width="116" height="18" rx="9"
        fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.35)" stroke-width="1"/>
  <text x="521" y="268" fill="rgba(20,184,166,0.72)" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.08em">AMBIENT</text>
  <text x="521" y="298" fill="rgba(255,255,255,0.20)" font-size="8.5" text-anchor="middle" letter-spacing="0.05em">chromate-free passivant</text>

  <!-- ═══ STAGE 5 — DI RINSE ═══ -->
  <rect x="592" y="101" width="140" height="208" fill="rgba(6,182,212,0.10)"/>
  <rect x="592" y="84"  width="140" height="5"   fill="rgba(6,182,212,0.48)"/>
  <text x="662" y="232" fill="rgba(6,182,212,0.055)" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-0.04em">05</text>
  <line x1="662" y1="101" x2="662" y2="122" stroke="rgba(6,182,212,0.36)" stroke-width="1.5"/>
  <line x1="662" y1="122" x2="644" y2="139" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <line x1="662" y1="122" x2="680" y2="139" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <circle cx="662" cy="101" r="2.2" fill="rgba(6,182,212,0.45)"/>
  <text x="662" y="158" fill="rgba(6,182,212,0.80)" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.10em">DI RINSE</text>
  <text x="662" y="173" fill="rgba(255,255,255,0.55)" font-size="10" text-anchor="middle" letter-spacing="0.05em">Deionised water</text>
  <text x="662" y="185" fill="rgba(255,255,255,0.35)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">Removes all residual ions</text>
  <text x="662" y="196" fill="rgba(255,255,255,0.32)" font-size="9"  text-anchor="middle" letter-spacing="0.04em">&amp; process chemicals</text>
  <rect x="604" y="255" width="116" height="18" rx="9"
        fill="rgba(6,182,212,0.11)" stroke="rgba(6,182,212,0.33)" stroke-width="1"/>
  <text x="662" y="268" fill="rgba(6,182,212,0.68)" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DI · AMBIENT</text>
  <text x="662" y="298" fill="rgba(255,255,255,0.20)" font-size="8.5" text-anchor="middle" letter-spacing="0.05em">&lt;10 μS/cm conductivity</text>

  <!-- ═══ DIVIDERS ═══ -->
  <line x1="169" y1="84" x2="169" y2="326" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <line x1="310" y1="84" x2="310" y2="326" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <line x1="451" y1="84" x2="451" y2="326" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <line x1="592" y1="84" x2="592" y2="326" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

  <!-- ═══ BOTTOM BADGE ═══ -->
  <rect x="158" y="352" width="444" height="24" rx="12"
        fill="rgba(254,206,0,0.08)" stroke="rgba(254,206,0,0.28)" stroke-width="1"/>
  <text x="380" y="368" fill="rgba(254,206,0,0.68)" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.14em">5-STAGE — DERUST + PASSIVATION</text>

  <text x="380" y="402" fill="rgba(255,255,255,0.22)" font-size="10" text-anchor="middle" letter-spacing="0.06em">For pre-rusted substrates · moderate outdoor corrosion exposure</text>

  <!-- Ghost number -->
  <text x="545" y="472" fill="rgba(254,206,0,0.04)" font-size="120" font-weight="900" letter-spacing="-0.05em">5</text>
</svg>
