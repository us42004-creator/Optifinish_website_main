<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="cureglow02" cx="40%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#FF6B20" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF6B20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="co_bg02" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="520" fill="url(#co_bg02)"/>

  <!-- Grid -->
  <line x1="0"   y1="95"  x2="760" y2="95"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="285" x2="760" y2="285" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="380" x2="760" y2="380" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="475" x2="760" y2="475" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="95"  y1="0"   x2="95"  y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="190" y1="0"   x2="190" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="285" y1="0"   x2="285" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="380" y1="0"   x2="380" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="475" y1="0"   x2="475" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="570" y1="0"   x2="570" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="665" y1="0"   x2="665" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Heat glow inside oven -->
  <ellipse cx="360" cy="290" rx="240" ry="125" fill="url(#cureglow02)"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="30" y="128" width="700" height="8" rx="3"
        fill="rgba(140,150,160,0.30)" stroke="rgba(180,185,190,0.25)" stroke-width="1"/>
  <polygon points="706,129 720,132 706,135" fill="rgba(254,206,0,0.50)"/>
  <text x="580" y="122" fill="rgba(254,206,0,0.35)" font-size="9" font-weight="600" letter-spacing="0.14em">LINE →</text>

  <!-- ═══ OVEN TUNNEL ═══ -->
  <!-- Oven walls -->
  <rect x="95" y="145" width="490" height="210" rx="6"
        fill="rgba(28,20,14,0.80)" stroke="rgba(220,100,30,0.38)" stroke-width="1.5"/>
  <!-- Insulation top -->
  <rect x="95" y="145" width="490" height="20" rx="3"
        fill="rgba(50,35,22,0.65)" stroke="rgba(180,90,25,0.30)" stroke-width="1"/>
  <!-- Insulation bottom -->
  <rect x="95" y="335" width="490" height="20" rx="3"
        fill="rgba(50,35,22,0.65)" stroke="rgba(180,90,25,0.30)" stroke-width="1"/>
  <!-- Interior glow -->
  <rect x="110" y="165" width="460" height="170" rx="3" fill="rgba(254,100,20,0.05)"/>

  <!-- Burner icons on top -->
  <rect x="145" y="153" width="22" height="10" rx="2"
        fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="265" y="153" width="22" height="10" rx="2"
        fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="385" y="153" width="22" height="10" rx="2"
        fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="505" y="153" width="22" height="10" rx="2"
        fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <!-- Flame lines from burners -->
  <line x1="156" y1="163" x2="156" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="276" y1="163" x2="276" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="396" y1="163" x2="396" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="516" y1="163" x2="516" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>

  <!-- Heat waves inside oven -->
  <path d="M160,230 Q170,218 160,206 Q150,194 160,182" fill="none" stroke="rgba(254,130,30,0.28)" stroke-width="1.5"/>
  <path d="M220,230 Q230,218 220,206 Q210,194 220,182" fill="none" stroke="rgba(254,130,30,0.24)" stroke-width="1.5"/>
  <path d="M280,230 Q290,218 280,206 Q270,194 280,182" fill="none" stroke="rgba(254,130,30,0.28)" stroke-width="1.5"/>
  <path d="M340,230 Q350,218 340,206 Q330,194 340,182" fill="none" stroke="rgba(254,130,30,0.24)" stroke-width="1.5"/>
  <path d="M400,230 Q410,218 400,206 Q390,194 400,182" fill="none" stroke="rgba(254,130,30,0.26)" stroke-width="1.5"/>
  <path d="M460,230 Q470,218 460,206 Q450,194 460,182" fill="none" stroke="rgba(254,130,30,0.22)" stroke-width="1.5"/>
  <path d="M520,230 Q530,218 520,206 Q510,194 520,182" fill="none" stroke="rgba(254,130,30,0.24)" stroke-width="1.5"/>

  <!-- ═══ PARTS ON CONVEYOR ═══ -->
  <!-- Part approaching oven (outside, left) -->
  <line x1="50" y1="136" x2="50" y2="155" stroke="rgba(200,205,215,0.35)" stroke-width="1.5"/>
  <rect x="36" y="200" width="28" height="80" rx="2"
        fill="rgba(254,206,0,0.18)" stroke="rgba(254,180,30,0.50)" stroke-width="1.5"/>

  <!-- Part inside oven — curing (with powder melt dots) -->
  <line x1="260" y1="136" x2="260" y2="155" stroke="rgba(200,205,215,0.35)" stroke-width="1.5"/>
  <rect x="246" y="215" width="28" height="80" rx="2"
        fill="rgba(254,206,0,0.14)" stroke="rgba(254,180,30,0.40)" stroke-width="1.5"/>
  <!-- Powder melting dots (top edge of part) -->
  <circle cx="252" cy="215" r="2.2" fill="rgba(254,160,30,0.60)"/>
  <circle cx="260" cy="213" r="2.5" fill="rgba(254,160,30,0.55)"/>
  <circle cx="268" cy="215" r="2.2" fill="rgba(254,160,30,0.60)"/>

  <!-- Part deeper in oven — curing mid-cycle -->
  <line x1="430" y1="136" x2="430" y2="155" stroke="rgba(200,205,215,0.32)" stroke-width="1.5"/>
  <rect x="416" y="215" width="28" height="80" rx="2"
        fill="rgba(254,206,0,0.11)" stroke="rgba(254,160,30,0.32)" stroke-width="1.5"/>

  <!-- ═══ TEMP BADGE ═══ -->
  <rect x="168" y="348" width="130" height="22" rx="11"
        fill="rgba(254,100,20,0.20)" stroke="rgba(254,100,20,0.42)" stroke-width="1"/>
  <text x="182" y="363" fill="rgba(254,150,50,0.88)" font-size="10" font-weight="700" letter-spacing="0.12em">180 – 200 °C</text>

  <!-- ── ANNOTATION: CURE ZONE (top, orange) ── -->
  <line x1="340" y1="143" x2="340" y2="108" stroke="rgba(240,115,35,0.42)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="340" cy="107" r="2.5" fill="rgba(240,115,35,0.65)"/>
  <text x="252" y="100" fill="rgba(240,115,35,0.80)" font-size="11" font-weight="600" letter-spacing="0.14em">180-200°C CURE ZONE</text>

  <!-- ── ANNOTATION: POWDER MELTS (bottom-right, yellow) ── -->
  <line x1="260" y1="296" x2="260" y2="395" stroke="rgba(254,206,0,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="260" cy="396" r="2.5" fill="rgba(254,206,0,0.50)"/>
  <text x="138" y="418" fill="rgba(254,206,0,0.62)" font-size="11" font-weight="600" letter-spacing="0.12em">POWDER MELTS → FLOWS → BONDS</text>

  <!-- Ghost step number -->
  <text x="540" y="490" fill="rgba(254,206,0,0.055)" font-size="155" font-weight="900" letter-spacing="-0.05em">02</text>
</svg>
