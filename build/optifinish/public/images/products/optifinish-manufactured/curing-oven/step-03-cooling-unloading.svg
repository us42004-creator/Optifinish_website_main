  <!-- Unload label -->
  <text x="556" y="395" fill="rgba(254,206,0,0.50)" font-size="9" font-weight="600" letter-spacing="0.12em">UNLOAD</text>

  <!-- Finished-part callout box -->
  <rect x="540" y="162" width="172" height="40" rx="6"
        fill="rgba(254,206,0,0.07)" stroke="rgba(254,206,0,0.24)" stroke-width="1"/>
  <text x="554" y="178" fill="rgba(254,206,0,0.62)" font-size="9" font-weight="600" letter-spacing="0.12em">HARD CROSS-LINKED COAT</text>
  <text x="554" y="193" fill="rgba(254,206,0,0.38)" font-size="9" letter-spacing="0.10em">READY FOR INSPECTION</text>
  <!-- Callout line to conveyor area -->
  <line x1="594" y1="202" x2="595" y2="306" stroke="rgba(254,206,0,0.22)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── ANNOTATION: COOLING SECTION (top, blue) ── -->
  <line x1="285" y1="143" x2="285" y2="108" stroke="rgba(80,160,210,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="285" cy="107" r="2.5" fill="rgba(80,160,210,0.62)"/>
  <text x="200" y="100" fill="rgba(80,160,210,0.72)" font-size="11" font-weight="600" letter-spacing="0.14em">COOLING SECTION</text>

  <!-- Ghost step number -->
  <text x="540" y="490" fill="rgba(254,206,0,0.055)" font-size="155" font-weight="900" letter-spacing="-0.05em">03</text>
</svg>
