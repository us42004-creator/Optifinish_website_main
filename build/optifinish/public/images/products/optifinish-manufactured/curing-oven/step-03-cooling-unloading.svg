<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="coolglow03" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#60b8e0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#60b8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="co_bg03" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="520" fill="url(#co_bg03)"/>

  <!-- Grid -->
  <line x1="0"   y1="95"  x2="760" y2="95"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="285" x2="760" y2="285" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="380" x2="760" y2="380" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="475" x2="760" y2="475" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="95"  y1="0"   x2="95"  y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="190" y1="0"   x2="190" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="285" y1="0"   x2="285" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="380" y1="0"   x2="380" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="475" y1="0"   x2="475" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="570" y1="0"   x2="570" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="665" y1="0"   x2="665" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Cool glow -->
  <ellipse cx="440" cy="285" rx="210" ry="120" fill="url(#coolglow03)"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="30" y="128" width="700" height="8" rx="3"
        fill="rgba(140,150,160,0.30)" stroke="rgba(180,185,190,0.25)" stroke-width="1"/>
  <polygon points="706,129 720,132 706,135" fill="rgba(254,206,0,0.50)"/>
  <text x="580" y="122" fill="rgba(254,206,0,0.35)" font-size="9" font-weight="600" letter-spacing="0.14em">LINE →</text>

  <!-- ═══ COOLING SECTION ═══ -->
  <rect x="95" y="145" width="380" height="210" rx="6"
        fill="rgba(14,22,30,0.75)" stroke="rgba(80,160,210,0.30)" stroke-width="1.5"/>
  <!-- Insulation top -->
  <rect x="95" y="145" width="380" height="20" rx="3"
        fill="rgba(22,38,52,0.55)" stroke="rgba(80,160,210,0.22)" stroke-width="1"/>
  <!-- Insulation bottom -->
  <rect x="95" y="335" width="380" height="20" rx="3"
        fill="rgba(22,38,52,0.55)" stroke="rgba(80,160,210,0.22)" stroke-width="1"/>

  <!-- Fan icon — left -->
  <circle cx="185" cy="240" r="52"
          fill="none" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="185" y1="188" x2="185" y2="292" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="133" y1="240" x2="237" y2="240" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="148" y1="203" x2="222" y2="277" stroke="rgba(80,160,210,0.16)" stroke-width="1"/>
  <line x1="222" y1="203" x2="148" y2="277" stroke="rgba(80,160,210,0.16)" stroke-width="1"/>
  <circle cx="185" cy="240" r="8" fill="rgba(40,65,88,0.55)" stroke="rgba(80,160,210,0.28)" stroke-width="1.5"/>

  <!-- Fan icon — right -->
  <circle cx="370" cy="240" r="48"
          fill="none" stroke="rgba(80,160,210,0.18)" stroke-width="1.5"/>
  <line x1="370" y1="192" x2="370" y2="288" stroke="rgba(80,160,210,0.18)" stroke-width="1.5"/>
  <line x1="322" y1="240" x2="418" y2="240" stroke="rgba(80,160,210,0.18)" stroke-width="1.5"/>
  <line x1="336" y1="206" x2="404" y2="274" stroke="rgba(80,160,210,0.13)" stroke-width="1"/>
  <line x1="404" y1="206" x2="336" y2="274" stroke="rgba(80,160,210,0.13)" stroke-width="1"/>
  <circle cx="370" cy="240" r="7" fill="rgba(40,65,88,0.55)" stroke="rgba(80,160,210,0.25)" stroke-width="1.5"/>

  <!-- Cool badge -->
  <rect x="155" y="348" width="110" height="22" rx="11"
