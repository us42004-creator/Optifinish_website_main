  <text x="173" y="363" fill="rgba(80,160,210,0.65)" font-size="10" font-weight="600" letter-spacing="0.10em">AMBIENT COOL</text>

  <!-- Parts on conveyor inside cooling section -->
  <line x1="230" y1="136" x2="230" y2="155" stroke="rgba(200,205,215,0.32)" stroke-width="1.5"/>
  <rect x="216" y="215" width="28" height="80" rx="2"
        fill="rgba(200,215,230,0.15)" stroke="rgba(200,215,230,0.38)" stroke-width="1.5"/>

  <!-- ═══ UNLOAD STATION — right ═══ -->
  <!-- Platform -->
  <rect x="560" y="355" width="90" height="8" rx="2"
        fill="rgba(140,150,165,0.30)" stroke="rgba(180,185,195,0.28)" stroke-width="1"/>
  <!-- Person silhouette -->
  <circle cx="595" cy="310" r="9"
          fill="rgba(200,210,225,0.25)" stroke="rgba(200,210,225,0.35)" stroke-width="1.5"/>
  <line x1="595" y1="319" x2="595" y2="355" stroke="rgba(200,210,225,0.28)" stroke-width="2"/>
  <line x1="581" y1="330" x2="609" y2="330" stroke="rgba(200,210,225,0.24)" stroke-width="1.5"/>
  <line x1="595" y1="355" x2="584" y2="372" stroke="rgba(200,210,225,0.22)" stroke-width="1.5"/>
  <line x1="595" y1="355" x2="606" y2="372" stroke="rgba(200,210,225,0.22)" stroke-width="1.5"/>
  <!-- Part held by person -->
  <rect x="610" y="310" width="22" height="60" rx="2"
