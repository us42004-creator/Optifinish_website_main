<svg viewBox="0 0 760 570" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="p3heatglow" cx="35%" cy="55%" r="38%">
      <stop offset="0%" stop-color="#FF6B20" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF6B20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3coolglow" cx="78%" cy="55%" r="28%">
      <stop offset="0%" stop-color="#60b8e0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#60b8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3bgr" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111418"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="570" fill="url(#p3bgr)"/>
  <!-- Grid -->
  <line x1="0" y1="95" x2="760" y2="95" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="285" x2="760" y2="285" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="380" x2="760" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="475" x2="760" y2="475" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="95" y1="0" x2="95" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="190" y1="0" x2="190" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="285" y1="0" x2="285" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="380" y1="0" x2="380" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="475" y1="0" x2="475" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="570" y1="0" x2="570" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="665" y1="0" x2="665" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Heat and cool glows -->
  <ellipse cx="270" cy="290" rx="220" ry="110" fill="url(#p3heatglow)"/>
  <ellipse cx="610" cy="290" rx="150" ry="90" fill="url(#p3coolglow)"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="40" y="128" width="680" height="8" rx="3" fill="rgba(140,150,160,0.30)" stroke="rgba(180,185,190,0.25)" stroke-width="1"/>
  <polygon points="695,129 710,132 695,135" fill="rgba(254,206,0,0.55)"/>
  <text x="600" y="122" fill="rgba(254,206,0,0.40)" font-size="9" font-weight="600" letter-spacing="0.14em">LINE DIRECTION →</text>

  <!-- ═══ CURING OVEN TUNNEL ═══ -->
  <!-- Oven walls -->
  <rect x="60" y="145" width="430" height="195" rx="6" fill="rgba(28,20,14,0.80)" stroke="rgba(220,100,30,0.35)" stroke-width="1.5"/>
  <!-- Oven top insulation band -->
  <rect x="60" y="145" width="430" height="20" rx="3" fill="rgba(50,35,22,0.65)" stroke="rgba(180,90,25,0.30)" stroke-width="1"/>
  <!-- Oven bottom insulation band -->
  <rect x="60" y="320" width="430" height="20" rx="3" fill="rgba(50,35,22,0.65)" stroke="rgba(180,90,25,0.30)" stroke-width="1"/>
  <!-- Oven interior heat glow -->
  <rect x="75" y="165" width="400" height="155" rx="3" fill="rgba(254,100,20,0.05)"/>

  <!-- Burner icons on top -->
  <rect x="110" y="153" width="22" height="10" rx="2" fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="200" y="153" width="22" height="10" rx="2" fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="300" y="153" width="22" height="10" rx="2" fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <rect x="390" y="153" width="22" height="10" rx="2" fill="rgba(220,100,30,0.40)" stroke="rgba(240,120,40,0.45)" stroke-width="1"/>
  <!-- Burner flame marks -->
  <line x1="121" y1="163" x2="121" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="211" y1="163" x2="211" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="311" y1="163" x2="311" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>
  <line x1="401" y1="163" x2="401" y2="178" stroke="rgba(254,160,40,0.50)" stroke-width="1.5"/>

  <!-- Heat waves inside oven -->
  <path d="M100,220 Q112,208 100,196 Q88,184 100,172" fill="none" stroke="rgba(254,130,30,0.30)" stroke-width="1.5"/>
  <path d="M155,220 Q167,208 155,196 Q143,184 155,172" fill="none" stroke="rgba(254,130,30,0.25)" stroke-width="1.5"/>
  <path d="M210,220 Q222,208 210,196 Q198,184 210,172" fill="none" stroke="rgba(254,130,30,0.30)" stroke-width="1.5"/>
  <path d="M265,220 Q277,208 265,196 Q253,184 265,172" fill="none" stroke="rgba(254,130,30,0.25)" stroke-width="1.5"/>
  <path d="M320,220 Q332,208 320,196 Q308,184 320,172" fill="none" stroke="rgba(254,130,30,0.28)" stroke-width="1.5"/>
  <path d="M375,220 Q387,208 375,196 Q363,184 375,172" fill="none" stroke="rgba(254,130,30,0.25)" stroke-width="1.5"/>
  <path d="M430,220 Q442,208 430,196 Q418,184 430,172" fill="none" stroke="rgba(254,130,30,0.22)" stroke-width="1.5"/>

  <!-- Temp badge on oven -->
  <rect x="180" y="325" width="130" height="22" rx="11" fill="rgba(254,100,20,0.20)" stroke="rgba(254,100,20,0.40)" stroke-width="1"/>
  <text x="195" y="340" fill="rgba(254,150,50,0.85)" font-size="10" font-weight="700" letter-spacing="0.12em">180 – 200 °C</text>
  <!-- Oven label -->
  <text x="188" y="414" fill="rgba(255,255,255,0.28)" font-size="10" letter-spacing="0.16em">CURING OVEN TUNNEL</text>

  <!-- ═══ COOLING SECTION ═══ -->
  <rect x="495" y="145" width="190" height="195" rx="6" fill="rgba(14,22,30,0.75)" stroke="rgba(80,160,210,0.28)" stroke-width="1.5"/>
  <!-- Cool section top -->
  <rect x="495" y="145" width="190" height="20" rx="3" fill="rgba(22,38,52,0.55)" stroke="rgba(80,160,210,0.22)" stroke-width="1"/>
  <!-- Cool section bottom -->
  <rect x="495" y="320" width="190" height="20" rx="3" fill="rgba(22,38,52,0.55)" stroke="rgba(80,160,210,0.22)" stroke-width="1"/>
  <!-- Cool fan icons -->
  <circle cx="540" cy="218" r="16" fill="none" stroke="rgba(80,160,210,0.25)" stroke-width="1.5"/>
  <line x1="524" y1="218" x2="556" y2="218" stroke="rgba(80,160,210,0.25)" stroke-width="1.5"/>
  <line x1="540" y1="202" x2="540" y2="234" stroke="rgba(80,160,210,0.25)" stroke-width="1.5"/>
  <line x1="529" y1="207" x2="551" y2="229" stroke="rgba(80,160,210,0.18)" stroke-width="1"/>
  <line x1="551" y1="207" x2="529" y2="229" stroke="rgba(80,160,210,0.18)" stroke-width="1"/>

  <circle cx="635" cy="218" r="16" fill="none" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="619" y1="218" x2="651" y2="218" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="635" y1="202" x2="635" y2="234" stroke="rgba(80,160,210,0.22)" stroke-width="1.5"/>
  <line x1="624" y1="207" x2="646" y2="229" stroke="rgba(80,160,210,0.15)" stroke-width="1"/>
  <line x1="646" y1="207" x2="624" y2="229" stroke="rgba(80,160,210,0.15)" stroke-width="1"/>

  <!-- Cool label -->
  <text x="526" y="414" fill="rgba(80,160,210,0.50)" font-size="10" letter-spacing="0.16em">COOLING SECTION</text>
  <!-- Cool badge -->
  <rect x="520" y="325" width="110" height="22" rx="11" fill="rgba(80,160,210,0.10)" stroke="rgba(80,160,210,0.28)" stroke-width="1"/>
  <text x="540" y="340" fill="rgba(80,160,210,0.65)" font-size="10" font-weight="600" letter-spacing="0.10em">AMBIENT COOL</text>

  <!-- ═══ PARTS ON CONVEYOR ═══ -->
  <!-- Part in oven — powder coating (yellow tint = curing) -->
  <line x1="200" y1="136" x2="200" y2="155" stroke="rgba(200,205,215,0.35)" stroke-width="1.5"/>
  <rect x="186" y="215" width="28" height="80" rx="2" fill="rgba(254,206,0,0.14)" stroke="rgba(254,180,30,0.40)" stroke-width="1.5"/>
  <!-- Melt/flow dots on part -->
  <circle cx="194" cy="215" r="2" fill="rgba(254,160,30,0.55)"/>
  <circle cx="200" cy="213" r="2.5" fill="rgba(254,160,30,0.50)"/>
  <circle cx="207" cy="215" r="2" fill="rgba(254,160,30,0.55)"/>

  <!-- Part in cooling -->
  <line x1="555" y1="136" x2="555" y2="155" stroke="rgba(200,205,215,0.35)" stroke-width="1.5"/>
  <rect x="541" y="248" width="28" height="80" rx="2" fill="rgba(200,215,230,0.15)" stroke="rgba(200,215,230,0.35)" stroke-width="1.5"/>

  <!-- ═══ UNLOAD STATION ═══ -->
  <!-- Platform -->
  <rect x="695" y="345" width="55" height="8" rx="2" fill="rgba(140,150,165,0.30)" stroke="rgba(180,185,195,0.30)" stroke-width="1"/>
  <!-- Person silhouette (simplified) -->
  <circle cx="718" cy="310" r="8" fill="rgba(200,210,225,0.25)" stroke="rgba(200,210,225,0.35)" stroke-width="1.5"/>
  <line x1="718" y1="318" x2="718" y2="345" stroke="rgba(200,210,225,0.30)" stroke-width="2"/>
  <line x1="706" y1="328" x2="730" y2="328" stroke="rgba(200,210,225,0.25)" stroke-width="1.5"/>
  <line x1="718" y1="345" x2="708" y2="360" stroke="rgba(200,210,225,0.25)" stroke-width="1.5"/>
  <line x1="718" y1="345" x2="728" y2="360" stroke="rgba(200,210,225,0.25)" stroke-width="1.5"/>
  <!-- Unload label -->
  <text x="692" y="380" fill="rgba(254,206,0,0.50)" font-size="9" font-weight="600" letter-spacing="0.12em">UNLOAD</text>

  <!-- ═══ FLOW ARROWS ═══ -->
  <!-- Oven to cooling -->
  <line x1="490" y1="240" x2="494" y2="240" stroke="rgba(254,206,0,0.30)" stroke-width="1.5"/>

  <!-- ═══ PROCESS ANNOTATION ═══ -->
  <line x1="280" y1="145" x2="280" y2="108" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="280" cy="108" r="2" fill="rgba(255,255,255,0.25)"/>
  <text x="100" y="98" fill="rgba(255,255,255,0.28)" font-size="10" letter-spacing="0.14em">POWDER MELTS → FLOWS → CROSS-LINKS AT TEMPERATURE</text>

  <!-- ═══ POWDER COAT LAYER CALLOUT ═══ -->
  <rect x="60" y="430" width="165" height="38" rx="6" fill="rgba(254,206,0,0.07)" stroke="rgba(254,206,0,0.22)" stroke-width="1"/>
  <text x="72" y="446" fill="rgba(254,206,0,0.60)" font-size="9" font-weight="600" letter-spacing="0.12em">DURABLE HARD COAT</text>
  <text x="72" y="460" fill="rgba(254,206,0,0.38)" font-size="9" letter-spacing="0.10em">FULLY CROSS-LINKED</text>

  <!-- ═══ BIG STEP NUMBER ═══ -->
  <text x="560" y="530" fill="rgba(254,206,0,0.06)" font-size="160" font-weight="900" letter-spacing="-0.05em">03</text>
</svg>
