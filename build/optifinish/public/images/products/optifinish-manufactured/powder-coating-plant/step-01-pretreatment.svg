<svg viewBox="0 0 760 570" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="p1glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1bgr" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111418"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="570" fill="url(#p1bgr)"/>
  <!-- Grid -->
  <line x1="0" y1="95" x2="760" y2="95" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="285" x2="760" y2="285" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="380" x2="760" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="475" x2="760" y2="475" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="95" y1="0" x2="95" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="190" y1="0" x2="190" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="285" y1="0" x2="285" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="380" y1="0" x2="380" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="475" y1="0" x2="475" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="570" y1="0" x2="570" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="665" y1="0" x2="665" y2="570" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Subtle blue glow for chemical wash feel -->
  <ellipse cx="380" cy="300" rx="280" ry="120" fill="url(#p1glow)"/>

  <!-- ═══ CONVEYOR RAIL ═══ -->
  <rect x="40" y="128" width="680" height="8" rx="3" fill="rgba(140,150,160,0.30)" stroke="rgba(180,185,190,0.25)" stroke-width="1"/>
  <!-- Rail detail marks -->
  <line x1="100" y1="128" x2="100" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <line x1="200" y1="128" x2="200" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <line x1="300" y1="128" x2="300" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <line x1="400" y1="128" x2="400" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <line x1="500" y1="128" x2="500" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <line x1="600" y1="128" x2="600" y2="136" stroke="rgba(180,185,190,0.20)" stroke-width="1.5"/>
  <!-- Direction arrow on rail -->
  <polygon points="695,129 710,132 695,135" fill="rgba(254,206,0,0.55)"/>
  <text x="595" y="122" fill="rgba(254,206,0,0.45)" font-size="9" font-weight="600" letter-spacing="0.14em">CONVEYOR DIRECTION →</text>

  <!-- ═══ TUNNEL SHELL ═══ -->
  <!-- Main tunnel body -->
  <rect x="80" y="145" width="600" height="185" rx="6" fill="rgba(20,28,38,0.75)" stroke="rgba(80,130,190,0.30)" stroke-width="1.5"/>
  <!-- Tunnel top cap -->
  <rect x="80" y="145" width="600" height="18" rx="3" fill="rgba(40,55,75,0.55)" stroke="rgba(80,130,190,0.25)" stroke-width="1"/>
  <!-- Tunnel bottom cap -->
  <rect x="80" y="312" width="600" height="18" rx="3" fill="rgba(40,55,75,0.55)" stroke="rgba(80,130,190,0.25)" stroke-width="1"/>

  <!-- Stage dividers inside tunnel -->
  <line x1="218" y1="163" x2="218" y2="312" stroke="rgba(80,130,190,0.22)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="356" y1="163" x2="356" y2="312" stroke="rgba(80,130,190,0.22)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="494" y1="163" x2="494" y2="312" stroke="rgba(80,130,190,0.22)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ═══ STAGE LABELS ═══ -->
  <text x="102" y="178" fill="rgba(255,255,255,0.40)" font-size="9" font-weight="600" letter-spacing="0.14em">01 · DEGREASE</text>
  <text x="232" y="178" fill="rgba(255,255,255,0.40)" font-size="9" font-weight="600" letter-spacing="0.14em">02 · RINSE</text>
  <text x="365" y="178" fill="rgba(255,255,255,0.40)" font-size="9" font-weight="600" letter-spacing="0.14em">03 · PHOSPHATE</text>
  <text x="508" y="178" fill="rgba(255,255,255,0.40)" font-size="9" font-weight="600" letter-spacing="0.14em">04 · PASSIVATE</text>

  <!-- ═══ SPRAY NOZZLES & SPRAYS — TOP ROW ═══ -->
  <!-- Stage 1 nozzles top -->
  <circle cx="130" cy="190" r="4" fill="rgba(80,150,220,0.6)" stroke="rgba(120,180,240,0.5)" stroke-width="1"/>
  <circle cx="175" cy="190" r="4" fill="rgba(80,150,220,0.6)" stroke="rgba(120,180,240,0.5)" stroke-width="1"/>
  <!-- Spray lines stage 1 top -->
  <line x1="130" y1="194" x2="127" y2="215" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="130" y1="194" x2="130" y2="220" stroke="rgba(80,150,220,0.40)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="130" y1="194" x2="133" y2="215" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="194" x2="172" y2="215" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="194" x2="175" y2="220" stroke="rgba(80,150,220,0.40)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="194" x2="178" y2="215" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 2 nozzles top -->
  <circle cx="250" cy="190" r="4" fill="rgba(100,200,220,0.5)" stroke="rgba(140,220,240,0.45)" stroke-width="1"/>
  <circle cx="295" cy="190" r="4" fill="rgba(100,200,220,0.5)" stroke="rgba(140,220,240,0.45)" stroke-width="1"/>
  <line x1="250" y1="194" x2="247" y2="215" stroke="rgba(100,200,220,0.30)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="250" y1="194" x2="250" y2="220" stroke="rgba(100,200,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="250" y1="194" x2="253" y2="215" stroke="rgba(100,200,220,0.30)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="295" y1="194" x2="292" y2="215" stroke="rgba(100,200,220,0.30)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="295" y1="194" x2="295" y2="220" stroke="rgba(100,200,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="295" y1="194" x2="298" y2="215" stroke="rgba(100,200,220,0.30)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 3 nozzles top -->
  <circle cx="388" cy="190" r="4" fill="rgba(80,180,120,0.55)" stroke="rgba(120,210,150,0.45)" stroke-width="1"/>
  <circle cx="435" cy="190" r="4" fill="rgba(80,180,120,0.55)" stroke="rgba(120,210,150,0.45)" stroke-width="1"/>
  <line x1="388" y1="194" x2="385" y2="215" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="388" y1="194" x2="388" y2="220" stroke="rgba(80,180,120,0.38)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="388" y1="194" x2="391" y2="215" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="194" x2="432" y2="215" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="194" x2="435" y2="220" stroke="rgba(80,180,120,0.38)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="194" x2="438" y2="215" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Stage 4 nozzles top -->
  <circle cx="520" cy="190" r="4" fill="rgba(200,160,60,0.50)" stroke="rgba(230,190,80,0.45)" stroke-width="1"/>
  <circle cx="565" cy="190" r="4" fill="rgba(200,160,60,0.50)" stroke="rgba(230,190,80,0.45)" stroke-width="1"/>
  <line x1="520" y1="194" x2="517" y2="215" stroke="rgba(200,160,60,0.28)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="520" y1="194" x2="520" y2="220" stroke="rgba(200,160,60,0.34)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="520" y1="194" x2="523" y2="215" stroke="rgba(200,160,60,0.28)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="565" y1="194" x2="562" y2="215" stroke="rgba(200,160,60,0.28)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="565" y1="194" x2="565" y2="220" stroke="rgba(200,160,60,0.34)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="565" y1="194" x2="568" y2="215" stroke="rgba(200,160,60,0.28)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ═══ SPRAY NOZZLES — BOTTOM ROW ═══ -->
  <!-- Stage 1 bottom -->
  <circle cx="130" cy="300" r="4" fill="rgba(80,150,220,0.6)" stroke="rgba(120,180,240,0.5)" stroke-width="1"/>
  <circle cx="175" cy="300" r="4" fill="rgba(80,150,220,0.6)" stroke="rgba(120,180,240,0.5)" stroke-width="1"/>
  <line x1="130" y1="296" x2="127" y2="277" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="130" y1="296" x2="130" y2="272" stroke="rgba(80,150,220,0.40)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="130" y1="296" x2="133" y2="277" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="296" x2="172" y2="277" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="296" x2="175" y2="272" stroke="rgba(80,150,220,0.40)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="175" y1="296" x2="178" y2="277" stroke="rgba(80,150,220,0.35)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Stage 3 bottom -->
  <circle cx="388" cy="300" r="4" fill="rgba(80,180,120,0.55)" stroke="rgba(120,210,150,0.45)" stroke-width="1"/>
  <circle cx="435" cy="300" r="4" fill="rgba(80,180,120,0.55)" stroke="rgba(120,210,150,0.45)" stroke-width="1"/>
  <line x1="388" y1="296" x2="385" y2="277" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="388" y1="296" x2="388" y2="272" stroke="rgba(80,180,120,0.38)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="388" y1="296" x2="391" y2="277" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="296" x2="432" y2="277" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="296" x2="435" y2="272" stroke="rgba(80,180,120,0.38)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="435" y1="296" x2="438" y2="277" stroke="rgba(80,180,120,0.32)" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ═══ PARTS ON CONVEYOR (3 parts) ═══ -->
  <!-- Part 1 (entering, left) -->
  <line x1="112" y1="136" x2="112" y2="155" stroke="rgba(200,205,215,0.40)" stroke-width="1.5"/>
  <rect x="98" y="210" width="28" height="75" rx="2" fill="rgba(160,170,185,0.20)" stroke="rgba(200,210,225,0.40)" stroke-width="1.5"/>
  <!-- Part 2 (mid, phosphate zone) -->
  <line x1="398" y1="136" x2="398" y2="155" stroke="rgba(200,205,215,0.40)" stroke-width="1.5"/>
  <rect x="384" y="210" width="28" height="75" rx="2" fill="rgba(80,180,120,0.12)" stroke="rgba(120,210,150,0.35)" stroke-width="1.5"/>
  <!-- Part 3 (exiting, right) -->
  <line x1="650" y1="136" x2="650" y2="155" stroke="rgba(200,205,215,0.40)" stroke-width="1.5"/>
  <rect x="636" y="210" width="28" height="75" rx="2" fill="rgba(200,210,225,0.18)" stroke="rgba(220,225,235,0.40)" stroke-width="1.5"/>
  <!-- Part exit labels -->
  <text x="626" y="302" fill="rgba(255,255,255,0.20)" font-size="8.5" letter-spacing="0.10em">CLEAN</text>

  <!-- ═══ DRAIN TANKS BELOW ═══ -->
  <!-- Tank 1 - Degreaser -->
  <rect x="88" y="348" width="115" height="42" rx="4" fill="rgba(80,150,220,0.12)" stroke="rgba(80,150,220,0.30)" stroke-width="1"/>
  <text x="102" y="366" fill="rgba(80,150,220,0.60)" font-size="9" letter-spacing="0.10em">DEGREASER</text>
  <text x="108" y="380" fill="rgba(80,150,220,0.40)" font-size="8.5" letter-spacing="0.08em">HEATED BATH</text>
  <!-- Drain pipe -->
  <line x1="148" y1="330" x2="148" y2="348" stroke="rgba(80,150,220,0.30)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Tank 2 - Phosphate -->
  <rect x="362" y="348" width="115" height="42" rx="4" fill="rgba(80,180,120,0.12)" stroke="rgba(80,180,120,0.30)" stroke-width="1"/>
  <text x="372" y="366" fill="rgba(80,180,120,0.60)" font-size="9" letter-spacing="0.10em">PHOSPHATE</text>
  <text x="370" y="380" fill="rgba(80,180,120,0.40)" font-size="8.5" letter-spacing="0.08em">IRON / ZINC BATH</text>
  <line x1="420" y1="330" x2="420" y2="348" stroke="rgba(80,180,120,0.30)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Tank 3 - Passivate -->
  <rect x="498" y="348" width="115" height="42" rx="4" fill="rgba(200,160,60,0.12)" stroke="rgba(200,160,60,0.28)" stroke-width="1"/>
  <text x="515" y="366" fill="rgba(200,160,60,0.60)" font-size="9" letter-spacing="0.10em">PASSIVATE</text>
  <text x="508" y="380" fill="rgba(200,160,60,0.40)" font-size="8.5" letter-spacing="0.08em">CHROMATE / DI RINSE</text>
  <line x1="555" y1="330" x2="555" y2="348" stroke="rgba(200,160,60,0.28)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══ ANNOTATION ═══ -->
  <line x1="380" y1="145" x2="380" y2="108" stroke="rgba(255,255,255,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
  <circle cx="380" cy="108" r="2" fill="rgba(255,255,255,0.30)"/>
  <text x="240" y="98" fill="rgba(255,255,255,0.30)" font-size="10" letter-spacing="0.14em">MULTI-STAGE SPRAY PRETREATMENT TUNNEL</text>

  <!-- ═══ 3–7 stage badge ═══ -->
  <rect x="588" y="415" width="135" height="32" rx="14" fill="rgba(254,206,0,0.10)" stroke="rgba(254,206,0,0.30)" stroke-width="1"/>
  <text x="603" y="435" fill="rgba(254,206,0,0.70)" font-size="10" font-weight="700" letter-spacing="0.12em">3 – 7 STAGE SYSTEMS</text>

  <!-- ═══ BIG STEP NUMBER ═══ -->
  <text x="560" y="530" fill="rgba(254,206,0,0.06)" font-size="160" font-weight="900" letter-spacing="-0.05em">01</text>
</svg>
