<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FECE00" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FECE00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12161a"/>
      <stop offset="100%" stop-color="#070809"/>
    </radialGradient>
  </defs>

  <rect width="760" height="520" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="760" height="520" fill="none"
    style="background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:95px 95px"/>
  <line x1="0"   y1="95"  x2="760" y2="95"  stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="190" x2="760" y2="190" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="285" x2="760" y2="285" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="380" x2="760" y2="380" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0"   y1="475" x2="760" y2="475" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="95"  y1="0"   x2="95"  y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="190" y1="0"   x2="190" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="285" y1="0"   x2="285" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="380" y1="0"   x2="380" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="475" y1="0"   x2="475" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="570" y1="0"   x2="570" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="665" y1="0"   x2="665" y2="520" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Soft yellow glow behind powder cloud -->
  <ellipse cx="430" cy="270" rx="180" ry="110" fill="url(#glow)"/>

  <!-- ═══ ALUMINIUM PROFILE — 3/4 perspective, centred left ═══ -->
  <!-- Top face -->
  <polygon points="155,170 220,130 530,130 465,170"
           fill="rgba(254,206,0,0.20)" stroke="rgba(254,206,0,0.55)" stroke-width="1.5"/>
  <!-- Front face -->
  <rect x="155" y="170" width="310" height="175" rx="2"
        fill="rgba(145,158,175,0.12)" stroke="rgba(200,212,228,0.38)" stroke-width="1.5"/>
  <!-- Right face -->
  <polygon points="465,170 530,130 530,305 465,345"
           fill="rgba(100,112,128,0.12)" stroke="rgba(200,212,228,0.22)" stroke-width="1.5"/>

  <!-- Internal channel dashes (extrusion detail) -->
  <line x1="270" y1="170" x2="270" y2="345" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="350" y1="170" x2="350" y2="345" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="6,5"/>

  <!-- ── ANNOTATION: POWDER COAT LAYER ── -->
  <line x1="340" y1="128" x2="340" y2="88" stroke="rgba(254,206,0,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="340" cy="87" r="2.5" fill="rgba(254,206,0,0.75)"/>
  <text x="350" y="82" fill="rgba(254,206,0,0.80)" font-size="11" font-weight="600" letter-spacing="0.14em">POWDER COAT LAYER</text>

  <!-- ── ANNOTATION: ALUMINIUM PROFILE ── -->
  <line x1="155" y1="365" x2="155" y2="410" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="155" cy="411" r="2" fill="rgba(255,255,255,0.35)"/>
  <text x="84" y="432" fill="rgba(255,255,255,0.38)" font-size="10" letter-spacing="0.14em">ALUMINIUM PROFILE</text>

  <!-- ═══ SPRAY GUN — right side, simplified ═══ -->
  <!-- Handle -->
  <rect x="600" y="245" width="34" height="68" rx="5"
        fill="rgba(65,75,88,0.60)" stroke="rgba(175,185,198,0.40)" stroke-width="1.5"/>
  <!-- Barrel -->
  <rect x="566" y="237" width="52" height="28" rx="5"
        fill="rgba(65,75,88,0.60)" stroke="rgba(175,185,198,0.40)" stroke-width="1.5"/>
  <!-- Nozzle cone -->
  <polygon points="538,239 566,234 566,265 538,272"
           fill="rgba(75,85,98,0.60)" stroke="rgba(175,185,198,0.40)" stroke-width="1.5"/>
  <!-- Tip glow -->
  <circle cx="537" cy="255" r="4.5" fill="rgba(254,206,0,0.85)"/>

  <!-- HV cable (clean, single line) -->
  <path d="M634,245 Q658,210 680,192" fill="none" stroke="rgba(254,206,0,0.35)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="682" y="188" fill="rgba(254,206,0,0.52)" font-size="10" font-weight="600" letter-spacing="0.14em">HV CHARGE</text>

  <!-- ═══ POWDER PARTICLES — focused spray cone ═══ -->
  <!-- Cone guide lines (very faint) -->
  <line x1="536" y1="255" x2="466" y2="242" stroke="rgba(254,206,0,0.08)" stroke-width="1"/>
  <line x1="536" y1="255" x2="466" y2="268" stroke="rgba(254,206,0,0.08)" stroke-width="1"/>

  <!-- Particles — 3 columns, decreasing opacity toward profile -->
  <!-- Near nozzle -->
  <circle cx="518" cy="249" r="3.5" fill="rgba(254,206,0,0.68)"/>
  <circle cx="514" cy="259" r="3"   fill="rgba(254,206,0,0.62)"/>
  <circle cx="520" cy="268" r="3.5" fill="rgba(254,206,0,0.65)"/>
  <!-- Mid -->
  <circle cx="496" cy="245" r="3.5" fill="rgba(254,206,0,0.55)"/>
  <circle cx="490" cy="256" r="3"   fill="rgba(254,206,0,0.50)"/>
  <circle cx="498" cy="266" r="4"   fill="rgba(254,206,0,0.52)"/>
  <circle cx="485" cy="275" r="2.5" fill="rgba(254,206,0,0.44)"/>
  <!-- Near profile -->
  <circle cx="473" cy="244" r="3"   fill="rgba(254,206,0,0.42)"/>
  <circle cx="467" cy="255" r="3.5" fill="rgba(254,206,0,0.40)"/>
  <circle cx="474" cy="265" r="3"   fill="rgba(254,206,0,0.38)"/>
  <circle cx="470" cy="274" r="2.5" fill="rgba(254,206,0,0.34)"/>
  <!-- Scatter -->
  <circle cx="505" cy="240" r="2"   fill="rgba(254,206,0,0.40)"/>
  <circle cx="480" cy="238" r="1.5" fill="rgba(254,206,0,0.32)"/>
  <circle cx="508" cy="278" r="2"   fill="rgba(254,206,0,0.35)"/>

  <!-- Ghost step number -->
  <text x="560" y="490" fill="rgba(254,206,0,0.055)" font-size="155" font-weight="900" letter-spacing="-0.05em">01</text>
</svg>
