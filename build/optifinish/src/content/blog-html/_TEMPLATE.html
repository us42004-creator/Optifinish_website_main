<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ══════════════════════════════════════════════════
    OPTIFINISH BLOG POST — REQUIRED META TAGS
    Your backend portal must output these exactly.
    ══════════════════════════════════════════════════
  -->
  <meta name="title"       content="Your Post Title Here">
  <meta name="slug"        content="your-post-slug-here">
  <meta name="date"        content="2026-04-25">
  <meta name="category"    content="Equipment">
  <!--
    category must be EXACTLY one of (case-sensitive):
      Equipment       → GEMA guns, booths, spare parts, accessories
      Plant Design    → complete plants, setup cost, manufacturer comparison
      Automation      → Z-TAP, ZA01, reciprocators, automatic lines
      Process         → powder coating process, PT lines, quality, troubleshooting
      Liquid Coating  → Dürr systems, liquid paint application
  -->
  <meta name="excerpt"     content="One-sentence summary shown on the listing card. Keep under 200 characters.">
  <meta name="readingTime" content="6">
  <meta property="og:image" content="/images/blog/your-cover-image.jpg">
  <!-- og:image: upload cover to /public/images/blog/ and reference path here -->
</head>
<body>
  <!--
    Write your post HTML body here.
    Supported: h2, h3, p, ul, ol, li, strong, em, a, img, blockquote, table
    Images: use absolute /images/blog/ paths or external URLs
    The site layout (nav, header, footer, CTA) is added automatically.
  -->

  <h2>Section Heading</h2>
  <p>Your paragraph content here...</p>

  <h3>Sub-section</h3>
  <p>More content...</p>

  <ul>
    <li>Bullet point one</li>
    <li>Bullet point two</li>
  </ul>

</body>
</html>
