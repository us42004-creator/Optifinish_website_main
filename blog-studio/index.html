<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OptiFinish Blog Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0A0A0B', 900: '#111113', 850: '#16161A', 800: '#1E1E22', 700: '#2A2A30', 600: '#3A3A42' },
            ember: { 400: '#FF8B5C', 500: '#FF6B35', 600: '#E55A2B', 700: '#C24A20' },
            paper: { DEFAULT: '#FAFAF7', 100: '#F5F5F2', 200: '#E8E8E3', 300: '#C7C7C0' },
            steel: { 400: '#9CA3AF', 500: '#6B7280', 600: '#4B5563' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          letterSpacing: {
            'industrial': '0.18em'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A0A0B; }
    ::-webkit-scrollbar-thumb { background: #2A2A30; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3A3A42; }
    .grain::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }
    @keyframes pulse-ember {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255, 107, 53, 0); }
    }
    .pulse-ember { animation: pulse-ember 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-ink-950 text-paper grain">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
